<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Painel FydelisTech</title>
</head>
<body class="bg-black text-gray-200 min-h-screen">

    <div class="max-w-4xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6 py-4 border-b border-gray-800">
            <h1 class="text-xl font-bold text-blue-500 uppercase tracking-widest">Logs de Atividade</h1>
            <a href="/ia" class="text-xs bg-gray-900 border border-gray-700 px-3 py-1 rounded hover:bg-gray-800 transition">VOLTAR</a>
        </header>

        <div class="grid gap-4">
            {% if logs %}
                {% for log in logs %}
                <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg">
    <div class="flex justify-between items-center mb-2">
        <span class="text-[10px] text-gray-500 font-mono">{{ log.timestamp.strftime('%d/%m %H:%M') }}</span>
        <span class="text-[10px] bg-blue-900/30 text-blue-400 px-2 rounded">{{ log.user_id }}</span>
    </div>

    <div class="text-sm text-gray-300">
        <div id="short-{{ log.id }}">
            {{ log.conteudo[:150] }}{% if log.conteudo|length > 150 %}... 
            <button onclick="toggleLog({{ log.id }})" class="text-blue-500 hover:underline">[Ler mais]</button>
            {% endif %}
        </div>
        <div id="full-{{ log.id }}" class="hidden">
            {{ log.conteudo }}
                <button onclick="toggleLog({{ log.id }})" class="text-blue-500 hover:underline">[Ocultar]</button>
            </div>
        </div>
    </div>
                {% endfor %}
            {% else %}
                <div class="text-center py-20 text-gray-700">Sistema sem registros.</div>
            {% endif %}
        </div>
    </div>

    <script>
    function toggleLog(id) {
        const short = document.getElementById('short-' + id);
        const full = document.getElementById('full-' + id);
        
        short.classList.toggle('hidden');
        full.classList.toggle('hidden');
    }
    </script>
</body>
</html>
