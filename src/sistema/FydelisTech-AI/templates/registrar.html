<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>FydelisTech | Cadastro</title>
</head>
<body class="h-full bg-black flex items-center justify-center p-4">

    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-black to-black"></div>

    <div class="relative w-full max-w-sm bg-gray-900/50 backdrop-blur-md border border-gray-700 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white tracking-tighter">FYDELIS<span class="text-blue-500">TECH</span></h1>
            <p class="text-gray-500 text-xs uppercase tracking-[0.2em] mt-2">Criar Nova Conta</p>
        </div>

        {% if erro %}
        <div class="mb-4 p-3 bg-red-900/40 border border-red-500 rounded text-red-300 text-sm text-center">
            {{ erro }}
        </div>
        {% endif %}

        <!-- Formulário envia APENAS para cadastro -->
        <form method="POST" action="/registrar" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">E-mail</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-gray-300 mb-1">Senha (mínimo 6 caracteres)</label>
                <input type="password" id="senha" name="senha" required minlength="6"
                       class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            </div>

            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold transition-all duration-300 transform hover:scale-[1.02]">
                CRIAR MINHA CONTA
            </button>
        </form>

        <!-- Link separado para voltar ao login -->
        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">Já tem conta? 
                <a href="/login" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">
                    Fazer login
                </a>
            </p>
        </div>

        <div class="mt-8 flex items-center gap-2 text-[10px] text-gray-600 justify-center">
            <div class="w-1 h-1 bg-green-500 rounded-full animate-pulse"></div>
            SERVIDOR ONLINE - SEGURANÇA ATIVA
        </div>
    </div>

    <script>
    document.querySelector('form').addEventListener('submit', function() {
        const btn = this.querySelector('button[type="submit"]');
        btn.innerHTML = "PROCESSANDO...";
        btn.classList.add('opacity-50', 'pointer-events-none');
    });
    </script>
</body>
</html>
