<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FydelisTech-AI | Terminal Sênior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body { color: #d1d5db; line-height: 1.6; }
        .markdown-body pre { background: #1e1e1e !important; padding: 15px; border-radius: 8px; overflow-x: auto; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-4">
    
    <div class="bg-blue-900/20 border-b border-blue-800 p-2 text-center">
        <span class="text-xs text-blue-400 uppercase tracking-widest">
            🚀 Sistema FydelisTech OS v1.2 está ativo. 
            SALDO: R$ {{ "%.2f"|format(saldo or 0.0) }}
        </span>
    </div>

    <div class="w-full max-w-4xl bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl h-[85vh] flex flex-col overflow-hidden">
        <header class="bg-gray-900 border-b border-gray-800 p-4 text-center font-bold tracking-widest text-pink-500">
            FYDELISTECH-AI | TERMINAL DE SEGURANÇA
        </header>

        <div class="flex bg-gray-800 p-1">
            <button onclick="mostrar('chat-box')" class="flex-1 py-2 text-pink-500 font-bold hover:bg-gray-700">TERMINAL CHAT</button>
            <button onclick="mostrar('media-box')" class="flex-1 py-2 text-blue-500 font-bold hover:bg-gray-700">MÍDIA GENERATIVA</button>
            <button onclick="mostrar('gerarvideo-box')" class="flex-1 py-2 text-blue-500 font-bold hover:bg-gray-700">GERAR VIDEO</button>
        </div>

        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div id="chat"></div>
        </div>

        <div id="gerarvideo-box" class="hidden flex-1 overflow-y-auto p-6 space-y-6">
            <div class="p-4 bg-gray-800 rounded-lg">
                <input id="promptVideo" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-cyan-400" placeholder="Descreva o vídeo que deseja gerar...">
                <button onclick="gerarVideo()" class="mt-2 w-full bg-blue-600 py-2 rounded font-bold hover:bg-blue-700">GERAR VIDEO</button>
            </div>
            <div id="resultadoVideo" class="text-center mt-4"></div>
        </div>

        <div id="media-box" class="hidden flex-1 overflow-y-auto p-6 space-y-6">
            <div class="p-4 bg-gray-800 rounded-lg">
                <input id="promptInput" class="w-full bg-gray-950 border border-gray-700 rounded p-2 text-cyan-400" placeholder="Descreva o que deseja gerar...">
                <button onclick="gerarFoto()" class="mt-2 w-full bg-blue-600 py-2 rounded font-bold hover:bg-blue-700">GERAR IMAGEM</button>
            </div>
            <div id="resultado" class="text-center mt-4"></div>
        </div>

        <form id="formChat" class="p-4 bg-gray-900 border-t border-gray-800 flex gap-2">
            <input id="input" class="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-pink-500 text-cyan-400" placeholder="Digite seu comando...">
            <button class="bg-pink-600 px-6 py-2 rounded-lg font-bold">EXEC</button>
        </form>
    </div>

    <div class="flex items-center gap-4">
        <a href="/admin" class="text-blue-400 hover:text-blue-300">Painel Admin</a>
        
        <div class="flex gap-2">
            <a href="/trocar_conta" class="px-3 py-1 bg-yellow-600 text-white rounded hover:bg-yellow-700 transition text-sm">
                Trocar Conta
            </a>
            <a href="/logout" class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition text-sm">
                Sair
            </a>
        </div>
    </div>
    <div class="flex items-center gap-2 bg-gray-800 px-4 py-2 rounded-full border border-gray-700">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> <span class="text-blue-400 font-bold text-sm tracking-wider">
            OPERADOR: {{ email.split('@')[0] | upper }}
        </span>
    </div>
    <!-- ✅ CORREÇÃO AQUI: trocado current_user.is_premium por is_premium -->
    {% if not is_premium %}
        <a href="/planos" 
        class="fixed bottom-10 right-10 bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-full shadow-lg transition-all font-bold flex items-center gap-2">
        🚀 UPGRADE PARA PREMIUM
        </a>
    {% endif %}
    <script>
        function mostrar(aba) {
            document.getElementById('chat-box').classList.toggle('hidden', aba !== 'chat-box');
            document.getElementById('media-box').classList.toggle('hidden', aba !== 'media-box');
            document.getElementById('formChat').classList.toggle('hidden', aba !== 'chat-box');
            document.getElementById('gerarvideo-box').classList.toggle('hidden', aba !== 'gerarvideo-box');
        }
    </script>
    <script>
        async function gerarFoto() {
            const prompt = document.getElementById('promptInput').value;
            const resultado = document.getElementById('resultado');
            
            if(!prompt) return alert("Digite algo!");
            
            resultado.innerHTML = '<span class="text-blue-400 animate-pulse">PROCESSANDO...</span>';

            try {
                const res = await fetch('/gerar-foto', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt})
                });
                const data = await res.json();
                
                if(data.url) {
                    resultado.innerHTML = `<img src="${data.url}" class="rounded-lg border-2 border-pink-500 shadow-lg max-w-full">`;
                } else {
                    resultado.innerHTML = `<span class="text-red-500">ERRO: ${data.erro}</span>`;
                }
            } catch(err) {
                resultado.innerHTML = '<span class="text-red-500">Falha na comunicação.</span>';
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script>
        const form = document.getElementById('formChat');
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const msg = input.value.trim();
            if(!msg) return;

            // Mostra mensagem do usuário
            chat.innerHTML += `<div class="text-right"><span class="bg-pink-900/50 text-white px-4 py-2 rounded-lg">${msg}</span></div>`;
            input.value = '';

            const res = await fetch('/conversar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mensagem: msg})
            });
            const data = await res.json();
            
            // Renderiza resposta com Markdown
            const div = document.createElement('div');
            div.className = "markdown-body p-4 bg-gray-800 rounded-lg border border-gray-700";
            div.innerHTML = marked.parse(data.conteudo);
            chat.appendChild(div);
            
            // Aplica Highlight nos blocos de código
            Prism.highlightAll();
            chat.scrollTop = chat.scrollHeight;
        };
    </script>

    <script>
        async function gerarVideo() {
            const prompt = document.getElementById('promptVideo').value;
            const resultado = document.getElementById('resultadoVideo');
            
            if(!prompt) return alert("Descreva o vídeo!");
            
            resultado.innerHTML = '<span class="text-green-400 animate-pulse">RENDERIZANDO... Isso pode levar alguns minutos.</span>';

            try {
                const res = await fetch('/gerar-video', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt})
                });
                const data = await res.json();
                
                if(data.url) {
                    resultado.innerHTML = `<video controls class="w-full rounded-lg border-2 border-green-500"><source src="${data.url}" type="video/mp4"></video>`;
                } else {
                    resultado.innerHTML = `<span class="text-red-500">ERRO: ${data.erro}</span>`;
                }
            } catch(err) {
                resultado.innerHTML = '<span class="text-red-500">Falha na comunicação com o servidor de vídeo.</span>';
            }
        }
    </script>
</body>
</html>
