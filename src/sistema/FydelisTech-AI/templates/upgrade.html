<div class="p-8 bg-gray-900 rounded-lg border border-blue-500 text-center">
    <h2 class="text-2xl text-white font-bold mb-4">Assinar Plano Premium</h2>
    <p class="text-gray-400 mb-8">Desbloqueie auditorias avançadas e ferramentas de pentest.</p>
    
    <div id="paypal-button-container"></div>
</div>

<script src="https://www.paypal.com/sdk/js?client-id=SEU_CLIENT_ID_SANDBOX"></script>
<script>
  paypal.Buttons({
    createOrder: function(data, actions) {
      return actions.order.create({
        purchase_units: [{ amount: { value: '49.90' } }]
      });
    },
    onApprove: function(data, actions) {
      return actions.order.capture().then(function(details) {
        fetch('/confirmar-pagamento', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ orderID: data.orderID })
        }).then(res => res.json()).then(data => {
          if(data.status === 'sucesso') alert('Acesso Premium Liberado!');
        });
      });
    }
  }).render('#paypal-button-container');
</script>
