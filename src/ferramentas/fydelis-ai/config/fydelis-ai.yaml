# ── FydelisAI Configuration ─────────────────────────────
# FydelisTechos © 2026

ollama:
  url: http://localhost:11434
  model: gemma:latest
  timeout: 60
  stream: true
  temperature: 0.7
  max_tokens: 2048

behavior:
  auto_execute: false
  confirm_before_exec: true
  save_sessions: true
  session_dir: ~/.fydelis-ai/sessions

security:
  allowed_commands:
    - nmap
    - curl
    - gobuster
    - dirb
    - hydra
    - john
    - hashcat
    - sqlmap
    - nikto
    - wpscan
    - whatweb
    - dnsrecon
    - whois
  blocked_patterns:
    - "rm -rf"
    - "dd if="
    - ":(){ :|:& };:"
    - "mkfs"
    - "format"
    - "> /dev/sda"
  max_command_length: 4096

cache:
  enabled: true
  ttl: 3600  # 1 hour

output:
  dir: output
  verbose: false