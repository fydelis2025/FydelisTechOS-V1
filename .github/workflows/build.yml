name: Build FydelisTechOS V1 (Servidor)
run-name: Construindo ISO FydelisTechOS (Modo Servidor)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Gerar Imagem ISO
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧹 Liberar espaço massivo no disco do Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean
          df -h

      - name: 🚀 Executar Build
        run: |
          find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          
          cat << 'CONTAINER_SCRIPT' > run_build.sh
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          export DEBIAN_DIST=bookworm
          export ARCH=amd64
          export MIRROR=http://deb.debian.org/debian/
          export SEC_MIRROR=http://deb.debian.org/debian-security/

          echo "=== 1. Instalar dependências nativas ==="
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso rsync wget ca-certificates gnupg2 \
            debian-archive-keyring curl findutils coreutils cpio

          echo "=== 2. Preparar lista de pacotes (Foco em Servidor) ==="
          mkdir -p src/pacotes/
          cat > src/pacotes/lista_completa.txt << 'EOF'
          # Sistema base
          live-boot live-config live-config-systemd base-files base-passwd bash coreutils dash e2fsprogs grep hostname init-system-helpers libc6 login lsb-base mawk mount ncurses-base ncurses-bin perl-base sed tar util-linux debian-archive-keyring
          
          # Ferramentas de Rede e Administração
          nano vim htop lsof net-tools psmisc man-db bash-completion sudo wget curl rsync unzip xz-utils
          openssh-client openssh-server netcat-openbsd nmap traceroute mtr iproute2
          
          # Discos e Armazenamento
          gparted parted dosfstools ntfs-3g exfatprogs btrfs-progs lvm2
          
          # Compilação e Sistema
          build-essential nasm gcc g++ make systemd-sysv
          EOF

          echo "=== 3. Configurar Live Build ==="
          rm -rf auto config || true
          lb config \
            --distribution "${DEBIAN_DIST}" \
            --architectures "${ARCH}" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "${MIRROR}" \
            --binary-images iso-hybrid \
            --cache-packages false

          echo "=== 4. Estruturar Diretórios ==="
          mkdir -p config/package-lists/
          cp src/pacotes/lista_completa.txt config/package-lists/fydelis.list.chroot

          mkdir -p config/includes.chroot/usr/local/bin/
          mkdir -p config/includes.chroot/usr/local/src/fydel-terminal/
          
          # Copiar fontes e scripts mantidos
          [ -d "src/terminal" ] && cp -r src/terminal/* config/includes.chroot/usr/local/src/fydel-terminal/
          [ -f "src/sistema/gerenciador_pacotes.sh" ] && cp src/sistema/gerenciador_pacotes.sh config/includes.chroot/usr/local/bin/
          [ -f "src/instalador/fydel-install.sh" ] && cp src/instalador/fydel-install.sh config/includes.chroot/usr/local/bin/
          
          mkdir -p config/includes.chroot/etc/systemd/system/
          [ -d "src/sistema/servicos_systemd" ] && cp -r src/sistema/servicos_systemd/* config/includes.chroot/etc/systemd/system/

          echo "=== 5. Criar Hooks ==="
          mkdir -p config/hooks/normal
          cat << 'EOF' > config/hooks/normal/0500-build-system.hook.chroot
          #!/bin/bash
          set -e

          # Compilar Terminal Fydel
          if [ -d /usr/local/src/fydel-terminal ]; then
            cd /usr/local/src/fydel-terminal
            make clean && make && make install
          fi

          # Permissões
          chmod +x /usr/local/bin/*.sh || true
          
          # Habilitar fydelterm
          if [ -f /etc/systemd/system/fydelterm.service ]; then
            systemctl enable fydelterm.service
          fi
          EOF
          chmod +x config/hooks/normal/0500-build-system.hook.chroot

          echo "=== 6. Rodar o lb build ==="
          lb build --verbose 2>&1
          CONTAINER_SCRIPT

          chmod +x run_build.sh
          sudo docker run --privileged --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace debian:bookworm-slim /bin/bash -c "./run_build.sh"

      - name: 📦 Ajustar permissões e Salvar Artefato ISO
        run: |
          # Corrige o dono do arquivo ISO que veio do Docker (root -> usuário normal do runner)
          sudo chown -R $USER:$USER .
          
          # Procura onde o live-build salvou a ISO e renomeia
          if [ -f live-image-amd64.hybrid.iso ]; then
            mv live-image-amd64.hybrid.iso FydelisTechOS-Server.iso
          elif [ -f *.iso ]; then
            mv *.iso FydelisTechOS-Server.iso
          else
            echo "Erro: Arquivo ISO não encontrado!"
            exit 1
          fi
          
          ls -lh FydelisTechOS-Server.iso

      - name: 📤 Upload da ISO para os Artefatos do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-Server-ISO
          path: FydelisTechOS-Server.iso
          retention-days: 1
