name: Build FydelisTechOS V1
run-name: Construindo ISO FydelisTechOS
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Gerar Imagem ISO
    runs-on: ubuntu-22.04
    env:
      DEBIAN_DIST: bookworm
      ARCH: amd64
      MIRROR: http://deb.debian.org/debian/

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Instalar dependências de build
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            live-build debootstrap xorriso rsync wget ca-certificates gnupg2 \
            debian-archive-keyring debian-keyring build-essential nasm gcc g++ make libutil-dev

      - name: ⚙️ Configurar Live Build para Debian Bookworm
        run: |
          rm -rf auto config || true
          lb config \
            --distribution "${DEBIAN_DIST}" \
            --architectures "${ARCH}" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "${MIRROR}" \
            --mirror-chroot "${MIRROR}" \
            --mirror-binary "${MIRROR}" \
            --iso-application "FydelisTechOS V1" \
            --iso-publisher "FydelisTech" \
            --iso-volume "FYDELIS_V1" \
            --binary-images iso-hybrid

      - name: 📋 Preparar lista de pacotes
        run: |
          mkdir -p config/package-lists/
          if [ -f ./src/pacotes/lista_completa.txt ]; then
            cp ./src/pacotes/lista_completa.txt config/package-lists/fydelis.list.chroot
          else
            echo "Criando lista de pacotes..."
            mkdir -p ./src/pacotes/
            cat > ./src/pacotes/lista_completa.txt << 'EOF'
# Sistema base Debian
base-files base-passwd bash coreutils dash diffutils e2fsprogs findutils grep gzip hostname init-system-helpers libc6 login lsb-base mawk mount ncurses-base ncurses-bin perl-base sed tar util-linux debian-archive-keyring debian-keyring

# Ferramentas básicas
nano vim htop ncdu lsof net-tools psmisc man-db bash-completion sudo wget curl rsync unzip bzip2 xz-utils

# Escritório e Multimídia
libreoffice libreoffice-l10n-pt-br evince gpicview vlc vlc-l10n

# Áudio, Microfone e Som
pulseaudio pulseaudio-utils alsa-utils alsa-tools alsa-base pavucontrol pavucontrol-qt volumeicon-alsa

# Bluetooth
bluetooth bluez bluez-tools blueman

# Rede e Internet
firefox-esr network-manager network-manager-gnome wireless-tools wpasupplicant openssh-client openssh-server netcat-openbsd nmap traceroute mtr iproute2

# Discos e armazenamento
gparted parted dosfstools ntfs-3g exfatprogs btrfs-progs lvm2 gnome-disk-utility

# Segurança e Pentest
wireshark tshark tcpdump hydra john hashcat aircrack-ng reaver sqlmap nikto metasploit-framework binwalk foremost testdisk chkrootkit rkhunter

# Sistema e configuração
gnome-control-center system-config-printer hardinfo lm-sensors udisks2 openssl

# Dependências para a FydelisTech-AI
python3 python3-pip python3-requests
EOF
            cp ./src/pacotes/lista_completa.txt config/package-lists/fydelis.list.chroot
          fi

      - name: 📂 Incluir arquivos do sistema
        run: |
          mkdir -p config/includes.chroot/opt/fydel/
          cp -r ./src/* config/includes.chroot/opt/fydel/ || true

      - name: 🚀 Construir a ISO
        run: sudo lb build --verbose

      - name: 📦 Renomear ISO final
        run: |
          if [ -f binary.iso ]; then
            mv binary.iso FydelisTechOS-V1.0.iso
          else
            echo "❌ ISO não foi gerada — verifique os logs acima"
            exit 1
          fi

      - name: 💾 Salvar ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-V1.0
          path: FydelisTechOS-V1.0.iso
          retention-days: 30
