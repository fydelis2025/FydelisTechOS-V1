name: Build FydelisTechOS V1
run-name: Construindo ISO FydelisTechOS
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Gerar Imagem ISO
    runs-on: ubuntu-24.04
    env:
      DEBIAN_DIST: bookworm
      ARCH: amd64
      MIRROR: http://deb.debian.org/debian/

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Instalar dependências de build
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            live-build debootstrap xorriso rsync wget ca-certificates gnupg2 \
            debian-archive-keyring debian-keyring

      - name: 🔧 Sanitizar lista de pacotes (remover pacotes não-Debian)
        run: |
          # Remove metasploit-framework e hardinfo que não existem nos repositórios Debian
          sed -i '/metasploit-framework/d' src/pacotes/lista_completa.txt
          sed -i '/hardinfo/d' src/pacotes/lista_completa.txt
          echo "Lista de pacotes sanitizada:"
          cat src/pacotes/lista_completa.txt

      - name: ⚙️ Configurar Live Build
        run: |
          rm -rf auto config || true
          lb config \
            --distribution "${DEBIAN_DIST}" \
            --architectures "${ARCH}" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "${MIRROR}" \
            --mirror-chroot "${MIRROR}" \
            --mirror-binary "${MIRROR}" \
            --iso-application "FydelisTechOS V1" \
            --iso-publisher "FydelisTech" \
            --iso-volume "FYDELIS_V1" \
            --binary-images iso-hybrid \
            --debootstrap-options "--variant=minbase" \
            --cache-packages false

      - name: 📋 Copiar lista de pacotes
        run: |
          mkdir -p config/package-lists/
          cp src/pacotes/lista_completa.txt config/package-lists/fydelis.list.chroot

      - name: 📂 Incluir arquivos do sistema
        run: |
          mkdir -p config/includes.chroot/opt/fydel/
          cp -r src/* config/includes.chroot/opt/fydel/
          # Remove a pasta pacotes do include (não necessária no sistema final)
          rm -rf config/includes.chroot/opt/fydel/pacotes

      - name: 🚀 Construir a ISO
        run: sudo lb build --verbose 2>&1

      - name: 📦 Renomear ISO final
        run: |
          if [ -f live-image-amd64.hybrid.iso ]; then
            mv live-image-amd64.hybrid.iso FydelisTechOS-V1.0.iso
            ls -lh FydelisTechOS-V1.0.iso
          elif [ -f binary.iso ]; then
            mv binary.iso FydelisTechOS-V1.0.iso
            ls -lh FydelisTechOS-V1.0.iso
          else
            echo "❌ ISO não foi gerada"
            echo "Arquivos encontrados em $(pwd):"
            ls -la *.iso *.iso.* 2>/dev/null || echo "Nenhum .iso encontrado"
            exit 1
          fi

      - name: 💾 Salvar ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-V1.0
          path: FydelisTechOS-V1.0.iso
          retention-days: 30
