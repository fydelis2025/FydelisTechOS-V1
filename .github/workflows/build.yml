name: Build FydelisTechOS V1
run-name: Construindo ISO FydelisTechOS
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Gerar Imagem ISO
    runs-on: ubuntu-22.04
    env:
      DEBIAN_DIST: bookworm
      ARCH: amd64
      MIRROR: http://deb.debian.org/debian/

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📂 Verificar estrutura de arquivos
        run: |
          echo "Conteúdo da raiz:"
          ls -la
          echo "Conteúdo da pasta pacotes:"
          ls -la pacotes/ || echo "Pasta pacotes não encontrada"

      - name: 🛠️ Instalar dependências de build
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            live-build debootstrap xorriso rsync wget ca-certificates gnupg2 \
            debian-archive-keyring debian-keyring build-essential nasm gcc g++ make libutil-dev

      - name: ⚙️ Configurar Live Build para Debian Bookworm
        run: |
          rm -rf auto config || true
          lb config \
            --distribution "${DEBIAN_DIST}" \
            --architectures "${ARCH}" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "${MIRROR}" \
            --mirror-chroot "${MIRROR}" \
            --mirror-binary "${MIRROR}" \
            --iso-application "FydelisTechOS V1" \
            --iso-publisher "FydelisTech" \
            --iso-volume "FYDELIS_V1" \
            --binary-images iso-hybrid

      - name: 📋 Adicionar lista de pacotes (caminho corrigido)
        run: |
          mkdir -p config/package-lists/
          # Verifica se existe e copia
          if [ -f ./pacotes/lista_completa.txt ]; then
            cp ./pacotes/lista_completa.txt config/package-lists/fydelis.list.chroot
          else
            echo "ERRO: Arquivo lista_completa.txt não encontrado! Verifique a estrutura do repositório."
            exit 1
          fi

      - name: 📂 Incluir arquivos personalizados no sistema
        run: |
          mkdir -p config/includes.chroot/opt/fydel/
          cp -r ./src ./instalador ./documentacao ./pacotes config/includes.chroot/opt/fydel/ || true

      - name: 🚀 Construir a ISO
        run: sudo lb build --verbose

      - name: 📦 Renomear ISO final
        run: |
          if [ -f binary.iso ]; then
            mv binary.iso FydelisTechOS-V1.0.iso
          else
            echo "❌ ISO não foi gerada — verifique logs acima"
            exit 1
          fi

      - name: 💾 Salvar ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-V1.0
          path: FydelisTechOS-V1.0.iso
          retention-days: 30
