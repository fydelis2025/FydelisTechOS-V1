name: Build FydelisTechOS V1
run-name: Construindo ISO FydelisTechOS
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Gerar Imagem ISO
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm-slim
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
      DEBIAN_DIST: bookworm
      ARCH: amd64
      MIRROR: http://deb.debian.org/debian/
      SEC_MIRROR: http://deb.debian.org/debian-security/

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mantido para garantir limpeza preventiva no host hospedeiro
      - name: 🛠️ Instalar dependências
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso rsync wget ca-certificates gnupg2 \
            debian-archive-keyring curl findutils coreutils cpio

      - name: 🔧 Preparar lista de pacotes
        run: |
          mkdir -p src/pacotes/
          cat > src/pacotes/lista_completa.txt << 'EOF'
          # Sistema base
          base-files base-passwd bash coreutils dash diffutils e2fsprogs findutils grep gzip hostname init-system-helpers libc6 login lsb-base mawk mount ncurses-base ncurses-bin perl-base sed tar util-linux debian-archive-keyring
          
          # Ferramentas básicas
          nano vim htop ncdu lsof net-tools psmisc man-db bash-completion sudo wget curl rsync unzip bzip2 xz-utils
          
          # Escritório e Multimídia
          libreoffice libreoffice-l10n-pt-br evince gpicview vlc
          
          # Áudio
          pipewire pipewire-pulse wireplumber alsa-utils pavucontrol
          
          # Bluetooth
          bluetooth bluez bluez-tools blueman
          
          # Rede e Internet
          firefox-esr network-manager network-manager-gnome wireless-tools wpasupplicant openssh-client openssh-server netcat-openbsd nmap traceroute mtr iproute2
          
          # Discos e armazenamento
          gparted parted dosfstools ntfs-3g exfatprogs btrfs-progs lvm2 gnome-disk-utility
          
          # Segurança (Pentest)
          wireshark tshark tcpdump hydra john hashcat aircrack-ng reaver sqlmap nikto binwalk foremost testdisk chkrootkit rkhunter
          
          # Sistema e configuração
          gnome-control-center system-config-printer hardinfo lm-sensors udisks2 openssl plymouth plymouth-themes
          
          # Python e IA
          python3 python3-pip python3-requests
          
          # Compilação
          build-essential nasm gcc g++ make
          EOF

      - name: ⚙️ Configurar Live Build
        run: |
          rm -rf auto config || true
          lb config \
            --distribution "${DEBIAN_DIST}" \
            --architectures "${ARCH}" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "${MIRROR}" \
            --mirror-chroot "${MIRROR}" \
            --mirror-chroot-security "${SEC_MIRROR}" \
            --mirror-binary "${MIRROR}" \
            --mirror-binary-security "${SEC_MIRROR}" \
            --iso-application "FydelisTechOS V1" \
            --iso-publisher "FydelisTech" \
            --iso-volume "FYDELIS_V1" \
            --binary-images iso-hybrid \
            --cache-packages false \
            --apt-source-archives false

      - name: 📋 Copiar lista de pacotes
        run: |
          mkdir -p config/package-lists/
          cp src/pacotes/lista_completa.txt config/package-lists/fydelis.list.chroot

      - name: 📂 Copiar arquivos para a ISO
        run: |
          mkdir -p config/includes.chroot/usr/local/bin/
          mkdir -p config/includes.chroot/usr/local/src/fydel-terminal/
          mkdir -p config/includes.chroot/boot/grub/
          mkdir -p config/includes.chroot/usr/share/icons/fydel/
          mkdir -p config/includes.chroot/etc/systemd/system/
          mkdir -p config/includes.chroot/usr/share/doc/fydelistechos/
          mkdir -p config/includes.chroot/opt/fydel/telas/
          mkdir -p config/includes.chroot/opt/fydel/iso/
          
          mkdir -p config/bootloaders/grub/
          mkdir -p config/includes.binary/boot/grub/
          
          if [ -d "src/terminal" ] && [ "$(ls -A src/terminal 2>/dev/null)" ]; then
            cp -r src/terminal/* config/includes.chroot/usr/local/src/fydel-terminal/
          fi
          
          [ -f "src/sistema/fydel_ai.py" ] && cp src/sistema/fydel_ai.py config/includes.chroot/usr/local/bin/ || echo "f_ai missing"
          [ -f "src/sistema/gerenciador_pacotes.sh" ] && cp src/sistema/gerenciador_pacotes.sh config/includes.chroot/usr/local/bin/ || echo "g_pkg missing"
          [ -f "src/sistema/usuarios_permissoes.sh" ] && cp src/sistema/usuarios_permissoes.sh config/includes.chroot/usr/local/bin/ || echo "u_perm missing"
          [ -f "src/instalador/fydel-install.sh" ] && cp src/instalador/fydel-install.sh config/includes.chroot/usr/local/bin/ || echo "inst missing"
          
          if [ -d "src/sistema/grub" ] && [ "$(ls -A src/sistema/grub 2>/dev/null)" ]; then
            cp -r src/sistema/grub/* config/includes.chroot/boot/grub/
          fi
          
          if [ -f "src/sistema/grub/grub-theme-fydel/splash.png" ]; then
            echo "Injetando Splash no bootloader..."
            cp src/sistema/grub/grub-theme-fydel/splash.png config/bootloaders/grub/splash.png
            cp src/sistema/grub/grub-theme-fydel/splash.png config/includes.binary/boot/grub/splash.png
            
            mkdir -p config/includes.chroot/usr/share/plymouth/themes/fydel/
            cp src/sistema/grub/grub-theme-fydel/splash.png config/includes.chroot/usr/share/plymouth/themes/fydel/background.png
          else
            echo "splash.png nao encontrada"
          fi
          
          if [ -d "src/sistema/icones" ] && [ "$(ls -A src/sistema/icones 2>/dev/null)" ]; then
            cp -r src/sistema/icones/* config/includes.chroot/usr/share/icons/fydel/
          fi
          
          if [ -d "src/sistema/servicos_systemd" ] && [ "$(ls -A src/sistema/servicos_systemd 2>/dev/null)" ]; then
            cp -r src/sistema/servicos_systemd/* config/includes.chroot/etc/systemd/system/
          fi
          
          if [ -d "src/telas" ] && [ "$(ls -A src/telas 2>/dev/null)" ]; then
            cp -r src/telas/* config/includes.chroot/opt/fydel/telas/
          fi
          
          if [ -d "src/documentacao" ] && [ "$(ls -A src/documentacao 2>/dev/null)" ]; then
            cp -r src/documentacao/* config/includes.chroot/usr/share/doc/fydelistechos/
          fi
          
          if [ -d "src/iso" ] && [ "$(ls -A src/iso 2>/dev/null)" ]; then
            cp -r src/iso/* config/includes.chroot/opt/fydel/iso/
          fi
          
          chmod +x config/includes.chroot/usr/local/bin/*.sh 2>/dev/null || true
          chmod +x config/includes.chroot/usr/local/bin/*.py 2>/dev/null || true

      - name: 🔧 Criar Hooks de pós-instalação (Compilar e Ativar Serviços)
        run: |
          mkdir -p config/hooks/normal
          cat << 'EOF' > config/hooks/normal/0500-build-system.hook.chroot
          #!/bin/bash
          set -e

          echo "=== [Hook] Instalando o Ollama de forma nativa ==="
          curl -fsSL https://ollama.com/install.sh | sh || true

          # REMOVIDO: O download dos modelos em tempo de compilação foi retirado para evitar estouro de espaço no disco virtual do container.
          
          echo "=== [Hook] Removendo pacotes visuais padrões do Debian ==="
          apt-get purge -y desktop-base || true

          echo "=== [Hook] Configurando Tema de Splash Customizado (Plymouth) ==="
          if [ -d /usr/share/plymouth/themes/fydel ]; then
          cat << 'PLY' > /usr/share/plymouth/themes/fydel/fydel.plymouth
          [Plymouth Theme]
          Name=FydelisTechOS Splash
          Description=Custom splash screen for FydelisTechOS
          ModuleName=script
          
          [script]
          ImageDir=/usr/share/plymouth/themes/fydel
          ScriptFile=/usr/share/plymouth/themes/fydel/fydel.script
          PLY

          cat << 'SCR' > /usr/share/plymouth/themes/fydel/fydel.script
          wallpaper_image = Image("background.png");
          screen_width = Window.GetWidth();
          screen_height = Window.GetHeight();
          
          image_width = wallpaper_image.GetWidth();
          image_height = wallpaper_image.GetHeight();
          scale_x = screen_width / image_width;
          scale_y = screen_height / image_height;
          scale = Math.Max(scale_x, scale_y);
          resized_image = wallpaper_image.Scale(image_width * scale, image_height * scale);
          
          wallpaper_sprite = Sprite(resized_image);
          wallpaper_sprite.SetX((screen_width - resized_image.GetWidth()) / 2);
          wallpaper_sprite.SetY((screen_height - resized_image.GetHeight()) / 2);
          wallpaper_sprite.SetZ(-10);
          SCR

            plymouth-set-default-theme fydel || true
          fi

          echo "=== [Hook] Forçando parâmetros gráficos do Kernel no GRUB ==="
          if [ -f /etc/default/grub ]; then
            sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="quiet splash nomodeset video=efifb:off"/' /etc/default/grub
            update-grub || true
          fi

          echo "=== [Hook] Ativando Initramfs ==="
          update-initramfs -u -k all || true

          echo "=== [Hook] Compilando Terminal Híbrido ==="
          if [ -d /usr/local/src/fydel-terminal ]; then
            cd /usr/local/src/fydel-terminal
            make clean && make
            cp fydelterm /usr/local/bin/ 2>/dev/null || true
          fi

          echo "=== [Hook] Configurando Permissões e Aliases ==="
          chmod +x /usr/local/bin/fydel_ai.py 2>/dev/null || true
          chmod +x /usr/local/bin/gerenciador_pacotes.sh 2>/dev/null || true
          chmod +x /usr/local/bin/usuarios_permissoes.sh 2>/dev/null || true
          chmod +x /usr/local/bin/fydel-install.sh 2>/dev/null || true

          ln -sf /usr/local/bin/gerenciador_pacotes.sh /usr/local/bin/fydel-pkg
          ln -sf /usr/local/bin/fydel_ai.py /usr/local/bin/fydel-ai
          ln -sf /usr/local/bin/fydel-install.sh /usr/local/bin/fydel-install

          echo "=== [Hook] Ativando serviço do Terminal ==="
          if [ -f /etc/systemd/system/fydelterm.service ]; then
            systemctl daemon-reload
            systemctl enable fydelterm.service
          fi

          echo "=== [Hook] Injetando telas no perfil padrão ==="
          echo -e "\nif [ -f /opt/fydel/telas/tela_boas_vindas.txt ]; then cat /opt/fydel/telas/tela_boas_vindas.txt; fi" >> /root/.bashrc
          echo -e "echo -e '\\n\\033[1;35mPara instalar no disco rígido, digite: \\033[1;32mfydel-install\\033[0m\\n'" >> /root/.bashrc
          EOF
          
          chmod +x config/hooks/normal/0500-build-system.hook.chroot

      - name: 🔍 Verificar estrutura antes do build
        run: |
          echo "=== Pacotes a instalar ==="
          wc -l config/package-lists/fydelis.list.chroot
          echo "=== Arquivos incluídos na ISO ==="
          find config/includes.chroot/ -type f | sort
          echo "=== Hooks configurados ==="
          ls -la config/hooks/normal/
          echo "=== Tamanho total includes ==="
          du -sh config/includes.chroot/

      - name: 🚀 Construir a ISO
        run: |
          echo "Iniciando build da ISO..."
          lb build --verbose 2>&1
          echo "Build finalizado."

      - name: 📦 Renomear ISO final
        run: |
          echo "Procurando ISO gerada..."
          if [ -f live-image-amd64.hybrid.iso ]; then
            mv live-image-amd64.hybrid.iso FydelisTechOS-V1.0.iso
            ls -lh FydelisTechOS-V1.0.iso
          elif [ -f binary.iso ]; then
            mv binary.iso FydelisTechOS-V1.0.iso
            ls -lh FydelisTechOS-V1.0.iso
          else
            echo "❌ ISO não encontrada."
            exit 1
          fi

      - name: 💾 Salvar ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-V1.0
          path: FydelisTechOS-V1.0.iso
          retention-days: 30
