name: Build FydelisTechOS Server
run-name: Construindo ISO FydelisTechOS Server
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Gerar Imagem ISO Server
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧹 Liberar espaço massivo no disco do Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean
          df -h

      - name: 🚀 Executar Build dentro do Container Debian com Espaço do Host
        run: |
          # --- SANITIZAÇÃO AUTOMÁTICA DE CRLF PARA LF ---
          echo "=== Sanitizando quebras de linha dos scripts carregados (CRLF -> LF) ==="
          find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          find . -type f -name "*.txt" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          find . -type f -name "*.cpp" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          find . -type f -name "*.asm" -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          cat << 'CONTAINER_SCRIPT' > run_build.sh
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          export DEBIAN_DIST=bookworm
          export ARCH=amd64
          export MIRROR=http://deb.debian.org/debian/
          export SEC_MIRROR=http://deb.debian.org/debian-security/

          echo "=== 1. Instalar dependências nativas do Debian ==="
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso rsync wget ca-certificates gnupg2 \
            debian-archive-keyring curl findutils coreutils cpio

          echo "=== 2. Preparar lista de pacotes para Servidor ==="
          mkdir -p src/pacotes/
          cat > src/pacotes/lista_completa.txt << 'EOF'
          # Sistema base e Inicialização Live / Instalação Server
          live-boot live-config live-config-systemd base-files base-passwd bash coreutils dash diffutils e2fsprogs findutils grep gzip hostname init-system-helpers libc6 login lsb-base mawk mount ncurses-base ncurses-bin perl-base sed tar util-linux debian-archive-keyring
          
          # Ferramentas essenciais de administração e rede
          nano vim htop ncdu lsof net-tools psmisc man-db bash-completion sudo wget curl rsync unzip bzip2 xz-utils screen tmux
          
          # Conectividade e Serviços de Rede Avançados
          network-manager wireless-tools wpasupplicant openssh-client openssh-server netcat-openbsd nmap traceroute mtr iproute2 iptables ufw fail2ban
          
          # Discos, Armazenamento e Gerenciamento de Servidor
          parted dosfstools ntfs-3g exfatprogs btrfs-progs lvm2 mdadm cifs-utils nfs-common
          
          # Python e Automação (Sem IA pesada)
          python3 python3-pip python3-requests
          
          # Compilação e Desenvolvimento Básicos
          build-essential nasm gcc g++ make git
          EOF

          echo "=== 3. Configurar Live Build ==="
          rm -rf auto config || true
          lb config \
            --distribution "${DEBIAN_DIST}" \
            --architectures "${ARCH}" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "${MIRROR}" \
            --mirror-chroot "${MIRROR}" \
            --mirror-chroot-security "${SEC_MIRROR}" \
            --mirror-binary "${MIRROR}" \
            --mirror-binary-security "${SEC_MIRROR}" \
            --iso-application "FydelisTechOS Server" \
            --iso-publisher "FydelisTech" \
            --iso-volume "FYDELIS_SRV" \
            --binary-images iso-hybrid \
            --debian-installer netinst \
            --cache-packages false \
            --apt-source-archives false

          echo "=== 4. Estruturar Diretórios do Chroot e Binary ==="
          mkdir -p config/package-lists/
          cp src/pacotes/lista_completa.txt config/package-lists/fydelis.list.chroot

          # Criar pastas para receber os binários, scripts e assets visuais
          mkdir -p config/includes.chroot/usr/local/bin/
          mkdir -p config/includes.chroot/usr/local/src/fydel-terminal/
          mkdir -p config/includes.chroot/boot/grub/themes/grub-theme-fydel/
          mkdir -p config/includes.chroot/etc/systemd/system/
          mkdir -p config/includes.chroot/usr/share/doc/fydelistechos-server/
          mkdir -p config/includes.chroot/opt/fydel/telas/
          mkdir -p config/includes.chroot/opt/fydel/iso/
          
          mkdir -p config/bootloaders/grub/
          mkdir -p config/includes.binary/boot/grub/
          
          # Copiar fontes do terminal C++/Assembly
          if [ -d "src/terminal" ] && [ "$(ls -A src/terminal 2>/dev/null)" ]; then
            cp -r src/terminal/* config/includes.chroot/usr/local/src/fydel-terminal/
          fi
          
          # Copiar scripts internos de utilitários e instalação
          [ -f "src/sistema/gerenciador_pacotes.sh" ] && cp src/sistema/gerenciador_pacotes.sh config/includes.chroot/usr/local/bin/ || echo "g_pkg missing"
          [ -f "src/sistema/usuarios_permissoes.sh" ] && cp src/sistema/usuarios_permissoes.sh config/includes.chroot/usr/local/bin/ || echo "u_perm missing"
          [ -f "src/instalador/fydel-install.sh" ] && cp src/instalador/fydel-install.sh config/includes.chroot/usr/local/bin/ || echo "inst missing"
          
          # Acoplando o tema visual do GRUB (Modo Server - focado em texto/splash simples)
          [ -f "./theme.txt" ] && cp ./theme.txt config/includes.chroot/boot/grub/themes/grub-theme-fydel/
          [ -f "./colors.txt" ] && cp ./colors.txt config/includes.chroot/boot/grub/themes/grub-theme-fydel/
          
          GRUB_ASSETS="src/sistema/grub/grub-theme-fydel"
          if [ -d "$GRUB_ASSETS" ]; then
            [ -f "$GRUB_ASSETS/background.png" ] && cp "$GRUB_ASSETS/background.png" config/includes.chroot/boot/grub/themes/grub-theme-fydel/
            [ -f "$GRUB_ASSETS/logo.png" ] && cp "$GRUB_ASSETS/logo.png" config/includes.chroot/boot/grub/themes/grub-theme-fydel/
            [ -f "$GRUB_ASSETS/splash.png" ] && cp "$GRUB_ASSETS/splash.png" config/includes.chroot/boot/grub/themes/grub-theme-fydel/
            [ -f "$GRUB_ASSETS/grub.png" ] && cp "$GRUB_ASSETS/grub.png" config/includes.chroot/boot/grub/themes/grub-theme-fydel/
            
            cp "$GRUB_ASSETS/splash.png" config/bootloaders/grub/splash.png
            cp "$GRUB_ASSETS/splash.png" config/includes.binary/boot/grub/splash.png
          fi
          
          if [ -d "src/sistema/servicos_systemd" ] && [ "$(ls -A src/sistema/servicos_systemd 2>/dev/null)" ]; then
            cp -r src/sistema/servicos_systemd/* config/includes.chroot/etc/systemd/system/
          fi
          
          if [ -d "src/telas" ] && [ "$(ls -A src/telas 2>/dev/null)" ]; then
            cp -r src/telas/* config/includes.chroot/opt/fydel/telas/
          fi
          
          if [ -d "src/documentacao" ] && [ "$(ls -A src/documentacao 2>/dev/null)" ]; then
            cp -r src/documentacao/* config/includes.chroot/usr/share/doc/fydelistechos-server/
          fi
          
          chmod +x config/includes.chroot/usr/local/bin/*.sh 2>/dev/null || true
          chmod +x config/includes.chroot/usr/local/bin/*.py 2>/dev/null || true

          echo "=== 5. Criar Hooks ==="
          mkdir -p config/hooks/normal
          cat << 'EOF' > config/hooks/normal/0500-build-system.hook.chroot
          #!/bin/bash
          set -e
          
          # Sanitizar os scripts copiados dentro do ambiente chroot também
          find /usr/local/bin/ -type f -name "*.sh" -exec sed -i 's/\r$//' {} + 2>/dev/null || true

          echo "=== [Hook] Removendo pacotes visuais desnecessários para Server ==="
          apt-get purge -y desktop-base || true

          echo "=== [Hook] Configurando GRUB para modo Server (CLI otimizada) ==="
          if [ -f /etc/default/grub ]; then
            sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="quiet console=tty0 console=ttyS0,115200n8"/' /etc/default/grub
            update-grub || true
          fi

          echo "=== [Hook] Compilando Terminal Híbrido Fydel ==="
          if [ -d /usr/local/src/fydel-terminal ]; then
            cd /usr/local/src/fydel-terminal
            make clean && make && make install
          fi

          chmod +x /usr/local/bin/gerenciador_pacotes.sh 2>/dev/null || true
          chmod +x /usr/local/bin/usuarios_permissoes.sh 2>/dev/null || true
          chmod +x /usr/local/bin/fydel-install.sh 2>/dev/null || true

          ln -sf /usr/local/bin/gerenciador_pacotes.sh /usr/local/bin/fydel-pkg
          ln -sf /usr/local/bin/fydel-install.sh /usr/local/bin/fydel-install

          if [ -f /usr/local/bin/usuarios_permissoes.sh ]; then
            bash /usr/local/bin/usuarios_permissoes.sh
          fi

          if [ -f /etc/systemd/system/fydelterm.service ]; then
            systemctl daemon-reload
            systemctl enable fydelterm.service
          fi

          echo -e "\nif [ -f /opt/fydel/telas/tela_boas_vindas.txt ]; then cat /opt/fydel/telas/tela_boas_vindas.txt; fi" >> /root/.bashrc
          echo -e "echo -e '\\n\\033[1;35mPara instalar no disco do servidor, digite: \\033[1;32mfydel-install\\033[0m\\n'" >> /root/.bashrc
          EOF
          chmod +x config/hooks/normal/0500-build-system.hook.chroot

          echo "=== 6. Rodar o lb build ==="
          lb build --verbose 2>&1
          echo "Build finalizado com sucesso dentro do container."
          CONTAINER_SCRIPT

          chmod +x run_build.sh

          sudo docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -v /dev:/dev \
            -v /dev/pts:/dev/pts \
            -v /lib/modules:/lib/modules \
            debian:bookworm-slim /bin/bash -c "./run_build.sh"

      - name: 📦 Renomear ISO final para Server
        run: |
          if [ -f live-image-amd64.hybrid.iso ]; then
            mv live-image-amd64.hybrid.iso FydelisTechOS-Server-V1.0.iso
          elif [ -f binary.iso ]; then
            mv binary.iso FydelisTechOS-Server-V1.0.iso
          else
            echo "❌ ISO não encontrada."
            exit 1
          fi

      - name: 🌐 Upload da ISO para Servidores Oficiais de Upload
        run: |
          echo "=========================================================="
          echo "=== Tentando Rota 1: Litterbox (Catbox - Até 10GB) ==="
          echo "=========================================================="
          LINK_LITTERBOX=$(curl -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@FydelisTechOS-Server-V1.0.iso" https://litterbox.catbox.moe) || true
          echo "=========================================================="
          echo "🚀 LINK LITTERBOX: $LINK_LITTERBOX"
          echo "=========================================================="

          echo -e "\n=========================================================="
          echo "=== Tentando Rota 2: BashUpload ==="
          echo "=========================================================="
          curl -T FydelisTechOS-Server-V1.0.iso https://bashupload.com/FydelisTechOS-Server-V1.0.iso || true
          echo "=========================================================="

      - name: 💾 Salvar no GitHub (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: FydelisTechOS-Server-V1.0
          path: FydelisTechOS-Server-V1.0.iso
          retention-days: 1
          continue-on-error: true
